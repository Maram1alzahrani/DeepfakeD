<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430"><rect width="1200" height="430" rx="28" fill="#0F172A"/><text x="60" y="62" fill="#F8FAFC" font-family="Inter,Arial" font-size="28" font-weight="700">Modern Deepfake Detection Models</text><text x="60" y="94" fill="#94A3B8" font-family="Inter,Arial" font-size="16">Different architectures capture different kinds of manipulation evidence</text><g font-family="Inter,Arial"><rect x="60" y="145" width="240" height="210" rx="22" fill="#111827" stroke="#334155"/><text x="90" y="190" fill="#38BDF8" font-size="22" font-weight="700">CNN</text><text x="90" y="226" fill="#E2E8F0" font-size="16">Learns local texture</text><text x="90" y="252" fill="#E2E8F0" font-size="16">and edge artifacts.</text><text x="90" y="304" fill="#94A3B8" font-size="14">Strong spatial baseline</text><rect x="330" y="145" width="240" height="210" rx="22" fill="#111827" stroke="#334155"/><text x="360" y="190" fill="#A78BFA" font-size="22" font-weight="700">Xception</text><text x="360" y="226" fill="#E2E8F0" font-size="16">Depthwise separable</text><text x="360" y="252" fill="#E2E8F0" font-size="16">convolutions.</text><text x="360" y="304" fill="#94A3B8" font-size="14">Fine-grained visual cues</text><rect x="600" y="145" width="240" height="210" rx="22" fill="#111827" stroke="#334155"/><text x="630" y="190" fill="#34D399" font-size="22" font-weight="700">EfficientNet</text><text x="630" y="226" fill="#E2E8F0" font-size="16">Balances depth, width</text><text x="630" y="252" fill="#E2E8F0" font-size="16">and resolution.</text><text x="630" y="304" fill="#94A3B8" font-size="14">Efficient feature extraction</text><rect x="870" y="145" width="270" height="210" rx="22" fill="#111827" stroke="#334155"/><text x="900" y="190" fill="#F59E0B" font-size="22" font-weight="700">Vision Transformer</text><text x="900" y="226" fill="#E2E8F0" font-size="16">Uses image patches and</text><text x="900" y="252" fill="#E2E8F0" font-size="16">self-attention.</text><text x="900" y="304" fill="#94A3B8" font-size="14">Global facial relationships</text></g></svg>